services:
  postgres:
    image: postgres:16
    container_name: financeiro-db
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro_user
      POSTGRES_PASSWORD: financeiro_pass
    ports:
      - "5432:5432"
    volumes:
      - financeiro_pgdata:/var/lib/postgresql/data

volumes:
  financeiro_pgdata: